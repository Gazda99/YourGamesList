name: .NET Unit Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --logger "nunit;LogFileName=test-results.xml"

      # Generate GitHub Step Summary on failure or success
      - name: Publish Test Summary
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET Test Report
          path: '**/test-results.xml'
          reporter: dotnet-nunit
          list-suites: 'failed'
          fail-on-error: 'true'