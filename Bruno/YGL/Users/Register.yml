info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{ygl_url}}/users/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password" : "{{password}}",
        "email": "{{email}}",
        "dateOfBirth": "1990-01-01"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
