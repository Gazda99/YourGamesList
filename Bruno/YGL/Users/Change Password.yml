info:
  name: Change Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{ygl_url}}/users/auth/changePassword"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "{{new_password}}"
      }
  auth:
    type: bearer
    token: "{{user_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Old tokens are revoked on success; keep the collection usable with the freshly issued one.
        if (res.getStatus() === 200) {
          let data = res.getBody();
          bru.setEnvVar("user_token", data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
