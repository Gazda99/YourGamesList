info:
  name: Game by ID - Chosen
  type: http
  seq: 2

http:
  method: POST
  url: https://api.igdb.com/v4/games
  headers:
    - name: Client-ID
      value: aaskuwor85er232a6pw2pq86avtt1o
  body:
    type: text
    data: |-
      where id = 1942;
      fields 
      release_dates.date,
      release_dates.platform.name
      ;
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
